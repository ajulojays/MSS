[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mss-microbiome-state-score"
version = "0.1.0"
description = "MSS (Microbiome State Score): phenotype-informed microbiome oxygen-tolerance composition from taxonomic profiles and raw reads (research prototype)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Samuel Ajulo" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mss = "mss.cli:main"

[tool.setuptools]
packages = ["mss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
